[workspace]
resolver = "2"
members = ["boot", "kernel", "user/runtime", "compat/posix"]
default-members = ["boot", "kernel", "user/runtime", "compat/posix"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
lto = true
codegen-units = 1
